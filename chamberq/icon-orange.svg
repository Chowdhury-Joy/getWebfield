<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GWF">
  <!--
    GWF diamond monogram
    W fix: TWO SEPARATE valleys from the top (not one U trough)
    → left peak / valley / CENTER PEAK / valley / right peak
  -->
  <rect width="100" height="100" fill="#f97316"/>

  <defs>
    <mask id="gwf">
      <rect width="100" height="100" fill="#000"/>
      <polygon points="50,8 92,50 50,92 8,50" fill="#fff"/>

      <!-- G mouth -->
      <rect x="24" y="32" width="13" height="14" fill="#000"/>

      <!-- F openings -->
      <rect x="70" y="34" width="26" height="10" fill="#000"/>
      <rect x="78" y="52" width="18" height="26" fill="#000"/>

      <!--
        W = two SEPARATE top valleys.
        Leave ~5 units of white between them = the center peak.
        Each valley is its own pocket — they do NOT meet.
      -->
      <!-- Left valley of W -->
      <polygon points="40 10  46 10  45.2 56  41 56" fill="#000"/>
      <!-- Right valley of W -->
      <polygon points="54 10  60 10  59 56  54.8 56" fill="#000"/>

      <!-- Small bottom notches for two feet (not one U bowl) -->
      <polygon points="43 72  46 66  48 72  46 82" fill="#000"/>
      <polygon points="52 72  54 66  57 72  54 82" fill="#000"/>

      <!-- Side gutters G|W , W|F -->
      <rect x="37" y="30" width="2.2" height="40" fill="#000"/>
      <rect x="60.8" y="30" width="2.2" height="40" fill="#000"/>
    </mask>
  </defs>

  <polygon points="50,8 92,50 50,92 8,50" fill="#ffffff" mask="url(#gwf)"/>
</svg>
