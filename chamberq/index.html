<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChamberQ Kanban — 25 August</title>
<link rel="icon" type="image/svg+xml" href="icon-orange.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --surface: #1e2130;
      --surface-2: #262b3d;
      --border: #2e3650;
      --border-strong: #3d4668;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem 1.25rem;
  }

  .header { margin-bottom: 1.5rem; }
  .header-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .header-top h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .header-top .date { font-size: 13px; color: var(--text-muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 7px; }
  .stat {
    font-size: 12px; color: var(--text-secondary);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; padding: 3px 11px;
    display: flex; align-items: center; gap: 6px;
  }
  .stat .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .sync-status {
    font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 5px; margin-left: auto;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }
  .sync-dot.ok { background: #22c55e; }
  .sync-dot.err { background: #f87171; }

  #board { display: grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 12px; align-items: start; width: 100%; }

  .col { border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 11px 13px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .col-name { font-size: 12px; font-weight: 600; color: var(--text-secondary); flex: 1; text-transform: uppercase; letter-spacing: .05em; }
  .col-n { font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; line-height: 18px; }

  .cards-wrap { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 56px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius); padding: 10px 11px;
    cursor: grab; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
    user-select: none;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card.dragging { opacity: .25; cursor: grabbing; }
  .card.over { outline: 2px dashed #60a5fa; outline-offset: 1px; }
  .card.p0 { border-left-color: #cbd5e1; }
  .card.p1 { border-left-color: #60a5fa; }
  .card.p2 { border-left-color: #fbbf24; }
  .card.p3 { border-left-color: #f87171; }

  .card-text { font-size: 13px; line-height: 1.5; color: var(--text); margin-bottom: 9px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .stars-widget { display: flex; gap: 3px; align-items: center; }
  .sw-star { background: none; border: none; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; transition: transform .1s; }
  .sw-star:hover { transform: scale(1.2); }

  .card-acts { display: flex; gap: 3px; }
  .iact { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--text-muted); cursor: pointer; padding: 3px 6px; font-size: 11px; line-height: 1.4; }
  .iact:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
  .iact.del:hover { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
  .iact.comment:hover { background: #f5f3ff; border-color: #a855f7; color: #7e22ce; }
  .iact.voice.has-rec { color: #f97316; border-color: #f97316; }
  .iact.voice.has-rec:hover { background: #fff7ed; }
  .comment-count { font-size: 10px; background: #f5f3ff; color: #7e22ce; border-radius: 99px; padding: 1px 6px; margin-left: 4px; display: inline-block; }
  .voice-count { font-size: 10px; margin-left: 2px; }
  .comment-list { max-height: 200px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  .comment-item { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  .comment-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
  .comment-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 1rem 0; }
  .comment-row { display: flex; gap: 6px; margin-top: 8px; }
  .comment-row input { flex: 1; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-2); color: var(--text); font-family: inherit; }
  .comment-row input:focus { outline: none; border-color: #a855f7; }
  .comment-row button { padding: 7px 14px; background: #a855f7; color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-family: inherit; }
  .comment-row button:hover { background: #9333ea; }

  .drop-empty {
    min-height: 52px; border: 1.5px dashed var(--border); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 12px; margin: 2px; transition: background .1s;
  }
  .drop-empty.over { border-color: #60a5fa; background: #eff6ff; }

  .add-row {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 8px 13px; border: none; border-top: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 12px; font-family: inherit;
    border-radius: 0 0 12px 12px; transition: background .1s;
  }
  .add-row:hover { background: var(--surface); color: var(--text-secondary); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 1.25rem; width: 360px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-head { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  textarea { width: 100%; font-size: 13px; line-height: 1.5; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-2); color: var(--text); resize: none; font-family: inherit; min-height: 72px; }
  textarea:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 0 3px #dbeafe55; }
  .flabel { font-size: 11px; color: var(--text-muted); margin: 12px 0 7px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .pri-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .popt { padding: 8px 4px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; cursor: pointer; font-size: 11px; font-weight: 500; text-align: center; color: var(--text-secondary); font-family: inherit; transition: all .12s; }
  .popt:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .popt.sel[data-v="0"] { border-color: var(--border-strong); background: var(--surface-2); color: var(--text); }
  .popt.sel[data-v="1"] { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
  .popt.sel[data-v="2"] { border-color: #d97706; background: #fffbeb; color: #92400e; }
  .popt.sel[data-v="3"] { border-color: #dc2626; background: #fff1f2; color: #991b1b; }
  .modal-foot { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .mbtn { padding: 7px 16px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: transparent; color: var(--text); cursor: pointer; font-size: 13px; font-family: inherit; }
  .mbtn:hover { background: var(--surface-2); }
  .mbtn.ok { background: #2563eb; color: #fff; border-color: #2563eb; }
  .mbtn.ok:hover { background: #1d4ed8; }

  .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 13px; }

  .card-img-wrap { position: relative; margin-bottom: 8px; }
  .card-img { width: 100%; border-radius: 6px; max-height: 160px; object-fit: cover; cursor: zoom-in; display: block; }
  .card-img-del { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,.6); border: none; border-radius: 99px; color: #fff; cursor: pointer; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .card-img-del:hover { background: rgba(220,38,38,.85); }

  .img-picker { margin-top: 10px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 14px; text-align: center; cursor: pointer; transition: background .12s; }
  .img-picker:hover { background: var(--surface-2); }
  .img-picker-label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
  .img-preview-wrap { position: relative; margin-top: 10px; }
  .img-preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: var(--radius); display: block; }
  .img-preview-clear { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,.6); border: none; border-radius: 99px; color: #fff; cursor: pointer; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .img-preview-clear:hover { background: rgba(220,38,38,.85); }

  .rec-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .rec-item { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
  .rec-item-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .rec-meta { font-size: 10px; color: var(--text-muted); }
  .rec-audio { width: 100%; height: 36px; display: block; }
  .rec-ctrl { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 0 6px; border-top: 1px solid var(--border); margin-top: 12px; }
  .rec-btn { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: background .15s; }
  .rec-btn.idle { background: var(--surface-2); color: var(--text-secondary); }
  .rec-btn.idle:hover { background: #fee2e2; color: #dc2626; }
  .rec-btn.recording { background: #dc2626; color: #fff; animation: pulse-rec 1.2s ease-in-out infinite; }
  @keyframes pulse-rec { 0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)} 50%{box-shadow:0 0 0 10px rgba(220,38,38,0)} }
  .rec-timer { font-size: 14px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .rec-timer.active { color: #dc2626; }
  .rec-hint { font-size: 11px; color: var(--text-muted); }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 300; cursor: zoom-out; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }

  .footer { margin-top: auto; padding-top: 2.5rem; text-align: center; font-size: 11px; color: var(--text-muted); }
  @media (max-width: 640px) { #board { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>ChamberQ</h1>
    <span class="date">25 August</span>
    <span class="sync-status"><span class="sync-dot" id="sdot"></span><span id="slabel">Connecting…</span></span>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div id="board"><div class="loading">Loading…</div></div>

<footer class="footer">
  &copy; <span id="yr"></span> All rights reserved to <a href="https://chamberq.com" style="color:inherit;text-decoration:none">ChamberQ.com</a>
</footer>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, orderBy, query } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAPPeOLlVBF-vuSooeG7IOjx-ZXPqi3nSs",
  authDomain: "kanvan-chamberq.firebaseapp.com",
  projectId: "kanvan-chamberq",
  storageBucket: "kanvan-chamberq.firebasestorage.app",
  messagingSenderId: "68856306848",
  appId: "1:68856306848:web:3e81d4f1b4206ed343fdc5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, 'cards');

const COLS = [
  { id: 'todo',      label: 'To do',       color: '#94a3b8' },
  { id: 'doing',     label: 'In progress', color: '#3b82f6' },
  { id: 'inreview',  label: 'In review',   color: '#a855f7' },
  { id: 'done',      label: 'Done',        color: '#22c55e' },
];
const PCOLOR = ['#cbd5e1', '#60a5fa', '#fbbf24', '#f87171'];
const PLABEL = ['None', 'Low', 'Medium', 'High'];

let cards = [];
let drag = null, modal = null;

function setSyncStatus(state) {
  const dot = document.getElementById('sdot');
  const lbl = document.getElementById('slabel');
  if (state === 'ok')  { dot.className = 'sync-dot ok';  lbl.textContent = 'Synced'; }
  if (state === 'err') { dot.className = 'sync-dot err'; lbl.textContent = 'Offline'; }
  if (state === 'wait'){ dot.className = 'sync-dot';     lbl.textContent = 'Connecting…'; }
}

onSnapshot(colRef, snap => {
  cards = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
  cards.sort((a, b) => (b.p || 0) - (a.p || 0) || (a.order || 0) - (b.order || 0));

  setSyncStatus('ok');
  render();
}, err => {
  console.error(err);
  setSyncStatus('err');
});

function buildStars(cardId, p) {
  const w = document.createElement('div');
  w.className = 'stars-widget';
  const stars = [];
  for (let i = 1; i <= 3; i++) {
    const b = document.createElement('button');
    b.className = 'sw-star';
    b.textContent = '★';
    b.title = PLABEL[i] + ' priority';
    b.style.color = i <= p ? PCOLOR[p] : '#e2e8f0';
    b.addEventListener('mouseenter', () => {
      stars.forEach((s, idx) => s.style.color = idx < i ? PCOLOR[i] : '#e2e8f0');
    });
    b.addEventListener('click', e => {
      e.stopPropagation();
      const c = cards.find(x => x._id === cardId);
      if (!c) return;
      const newP = c.p === i ? 0 : i;
      updateDoc(doc(db, 'cards', cardId), { p: newP });
    });
    stars.push(b);
    w.appendChild(b);
  }
  w.addEventListener('mouseleave', () => {
    const c = cards.find(x => x._id === cardId);
    const cp = c ? c.p : 0;
    stars.forEach((s, idx) => s.style.color = idx < cp ? PCOLOR[cp] : '#e2e8f0');
  });
  return w;
}

function renderStats() {
  const total = cards.length;
  const high  = cards.filter(c => c.p === 3).length;
  const done  = cards.filter(c => c.col === 'done').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="dot" style="background:#94a3b8"></span>${total} total</div>
    <div class="stat"><span class="dot" style="background:#f87171"></span>${high} high priority</div>
    <div class="stat"><span class="dot" style="background:#22c55e"></span>${done} done</div>`;
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLS.forEach(col => {
    const cc = cards.filter(c => c.col === col.id);
    const wrap = document.createElement('div'); wrap.className = 'col';

    const head = document.createElement('div'); head.className = 'col-head';
    head.innerHTML = `<div class="col-dot" style="background:${col.color}"></div><span class="col-name">${col.label}</span><span class="col-n">${cc.length}</span>`;
    wrap.appendChild(head);

    const zone = document.createElement('div'); zone.className = 'cards-wrap';
    wrap.appendChild(zone);

    const addBtn = document.createElement('button'); addBtn.className = 'add-row';
    addBtn.innerHTML = '<i class="ti ti-plus" aria-hidden="true" style="font-size:13px"></i> Add card';
    addBtn.onclick = () => openAdd(col.id);
    wrap.appendChild(addBtn);
    board.appendChild(wrap);

    if (cc.length === 0) {
      const dz = document.createElement('div'); dz.className = 'drop-empty'; dz.textContent = 'Drop here';
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); dropTo(col.id); });
      zone.appendChild(dz);
    } else {
      cc.forEach(card => {
        const el = document.createElement('div');
        el.className = `card p${card.p}`; el.draggable = true;

        const txt = document.createElement('div'); txt.className = 'card-text'; txt.textContent = card.text;
        el.appendChild(txt);

        if (card.img) {
          const iw = document.createElement('div'); iw.className = 'card-img-wrap';
          const im = document.createElement('img'); im.className = 'card-img'; im.src = card.img;
          im.onclick = e => { e.stopPropagation(); openLightbox(card.img); };
          const idel = document.createElement('button'); idel.className = 'card-img-del'; idel.title = 'Remove image';
          idel.innerHTML = '<i class="ti ti-x" aria-hidden="true"></i>';
          idel.onclick = e => { e.stopPropagation(); updateDoc(doc(db, 'cards', card._id), { img: null }); };
          iw.appendChild(im); iw.appendChild(idel); el.appendChild(iw);
        }

        const foot = document.createElement('div'); foot.className = 'card-foot';
        foot.appendChild(buildStars(card._id, card.p));

        const acts = document.createElement('div'); acts.className = 'card-acts';
        const colIdx = COLS.findIndex(x => x.id === col.id);
        if (colIdx > 0) {
          const lb = document.createElement('button'); lb.className = 'iact'; lb.title = 'Move left';
          lb.innerHTML = '<i class="ti ti-arrow-left" aria-hidden="true"></i>';
          lb.onclick = e => { e.stopPropagation(); mv(card._id, -1); }; acts.appendChild(lb);
        }
        if (colIdx < 2) {
          const rb = document.createElement('button'); rb.className = 'iact'; rb.title = 'Move right';
          rb.innerHTML = '<i class="ti ti-arrow-right" aria-hidden="true"></i>';
          rb.onclick = e => { e.stopPropagation(); mv(card._id, 1); }; acts.appendChild(rb);
        }
        const eb = document.createElement('button'); eb.className = 'iact'; eb.title = 'Edit';
        eb.innerHTML = '<i class="ti ti-pencil" aria-hidden="true"></i>';
        eb.onclick = e => { e.stopPropagation(); openEdit(card._id, card.text); }; acts.appendChild(eb);
        if (col.id === 'inreview') {
          const cb = document.createElement('button'); cb.className = 'iact comment'; cb.title = 'Comments';
          const cc = card.commentCount || 0;
          cb.innerHTML = `<i class="ti ti-message" aria-hidden="true"></i>${cc > 0 ? `<span class="comment-count">${cc}</span>` : ''}`;
          cb.onclick = e => { e.stopPropagation(); openComments(card._id, card.text); }; acts.appendChild(cb);
        }
        const vc = card.voiceCount || 0;
        const vb = document.createElement('button');
        vb.className = `iact voice${vc > 0 ? ' has-rec' : ''}`; vb.title = 'Voice notes';
        vb.innerHTML = `<i class="ti ti-microphone" aria-hidden="true"></i>${vc > 0 ? `<span class="voice-count">${vc}</span>` : ''}`;
        vb.onclick = e => { e.stopPropagation(); openVoice(card._id, card.text); }; acts.appendChild(vb);
        const db2 = document.createElement('button'); db2.className = 'iact del'; db2.title = 'Delete';
        db2.innerHTML = '<i class="ti ti-trash" aria-hidden="true"></i>';
        db2.onclick = e => { e.stopPropagation(); delCard(card._id); }; acts.appendChild(db2);
        foot.appendChild(acts);
        el.appendChild(foot);

        el.addEventListener('dragstart', () => { drag = card._id; setTimeout(() => el.classList.add('dragging'), 0); });
        el.addEventListener('dragend', () => { drag = null; el.classList.remove('dragging'); });
        el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
        el.addEventListener('dragleave', () => el.classList.remove('over'));
        el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); dropTo(col.id); });
        zone.appendChild(el);
      });
    }
  });
  renderStats();
}

function dropTo(colId) {
  if (drag != null) {
    updateDoc(doc(db, 'cards', drag), { col: colId });
    drag = null;
  }
}

function mv(id, d) {
  const c = cards.find(x => x._id === id);
  const i = COLS.findIndex(x => x.id === c.col);
  const newCol = COLS[Math.max(0, Math.min(2, i + d))].id;
  updateDoc(doc(db, 'cards', id), { col: newCol });
}

function delCard(id) {
  if (confirm('Delete this card?')) deleteDoc(doc(db, 'cards', id));
}

function openComments(cardId, cardText) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" style="width:420px">
    <div class="modal-head" style="font-size:13px;color:var(--text-muted);font-weight:400;margin-bottom:4px">Comments</div>
    <div style="font-size:14px;font-weight:500;margin-bottom:12px;line-height:1.4">${cardText}</div>
    <div class="comment-list" id="clist"><div class="comment-empty">Loading…</div></div>
    <div class="comment-row">
      <input id="cinput" placeholder="Add a comment…" />
      <button onclick="window._postComment('${cardId}')">Post</button>
    </div>
    <div class="modal-foot" style="margin-top:10px">
      <button class="mbtn" onclick="window._closeM()">Close</button>
    </div>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) window._closeM(); });
  document.body.appendChild(ov);
  modal = { ov, selP: 0 };
  setTimeout(() => document.getElementById('cinput').focus(), 50);

  const commRef = collection(db, 'cards', cardId, 'comments');
  const unsub = onSnapshot(query(commRef, orderBy('createdAt', 'asc')), snap => {
    const list = document.getElementById('clist');
    if (!list) { unsub(); return; }
    if (snap.empty) { list.innerHTML = '<div class="comment-empty">No comments yet.</div>'; return; }
    list.innerHTML = snap.docs.map(d => {
      const c = d.data();
      const date = c.createdAt?.toDate ? c.createdAt.toDate().toLocaleString() : '';
      return `<div class="comment-item"><div class="comment-meta">${date}</div>${c.text}</div>`;
    }).join('');
    list.scrollTop = list.scrollHeight;
  });
  modal.unsub = unsub;
}

window._postComment = cardId => {
  const input = document.getElementById('cinput');
  const t = input?.value?.trim();
  if (!t) return;
  const commRef = collection(db, 'cards', cardId, 'comments');
  addDoc(commRef, { text: t, createdAt: serverTimestamp() });
  updateDoc(doc(db, 'cards', cardId), { commentCount: (cards.find(x => x._id === cardId)?.commentCount || 0) + 1 });
  input.value = '';
};

function imgPickerBlock(currentSrc) {
  return `
    <div class="flabel">Image <span style="font-weight:400;text-transform:none">(optional)</span></div>
    ${currentSrc
      ? `<div class="img-preview-wrap" id="ipw">
           <img class="img-preview" id="ipreview" src="${currentSrc}">
           <button class="img-preview-clear" onclick="window._clearImg()" title="Remove image"><i class="ti ti-x"></i></button>
         </div>`
      : `<div class="img-picker" id="ipw" onclick="window._pickImg()">
           <div class="img-picker-label"><i class="ti ti-photo" style="font-size:16px"></i> Click to add image</div>
         </div>`
    }`;
}

window._pickImg = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const file = inp.files[0]; inp.remove();
    if (!file || !modal) return;
    const b64 = await compressImage(file);
    modal.pendingImg = b64;
    const ipw = document.getElementById('ipw');
    if (!ipw) return;
    ipw.outerHTML = `<div class="img-preview-wrap" id="ipw">
      <img class="img-preview" id="ipreview" src="${b64}">
      <button class="img-preview-clear" onclick="window._clearImg()" title="Remove image"><i class="ti ti-x"></i></button>
    </div>`;
  };
  inp.click();
};

window._clearImg = () => {
  if (!modal) return;
  modal.pendingImg = null;
  modal.removeImg = true;
  const ipw = document.getElementById('ipw');
  if (ipw) ipw.outerHTML = `<div class="img-picker" id="ipw" onclick="window._pickImg()">
    <div class="img-picker-label"><i class="ti ti-photo" style="font-size:16px"></i> Click to add image</div>
  </div>`;
};

function openEdit(id, currentText) {
  const card = cards.find(c => c._id === id);
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-head">Edit card</div>
    <textarea id="et">${currentText}</textarea>
    ${imgPickerBlock(card?.img || null)}
    <div class="modal-foot">
      <button class="mbtn" onclick="window._closeM()">Cancel</button>
      <button class="mbtn ok" onclick="window._saveEdit('${id}')">Save</button>
    </div>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) window._closeM(); });
  document.body.appendChild(ov);
  modal = { ov, selP: 0, pendingImg: undefined, removeImg: false };
  const ta = document.getElementById('et');
  setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 50);
}

window._saveEdit = id => {
  const t = document.getElementById('et')?.value?.trim();
  if (!t) return;
  const update = { text: t };
  if (modal?.pendingImg) update.img = modal.pendingImg;
  if (modal?.removeImg && !modal?.pendingImg) update.img = null;
  updateDoc(doc(db, 'cards', id), update);
  window._closeM();
};

function openAdd(colId) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-head">New card</div>
    <textarea id="nt" placeholder="Describe the task…"></textarea>
    <div class="flabel">Priority</div>
    <div class="pri-opts">
      <button class="popt sel" data-v="0" onclick="mpick(0)">— None</button>
      <button class="popt" data-v="1" onclick="mpick(1)">★ Low</button>
      <button class="popt" data-v="2" onclick="mpick(2)">★★ Med</button>
      <button class="popt" data-v="3" onclick="mpick(3)">★★★ High</button>
    </div>
    ${imgPickerBlock(null)}
    <div class="modal-foot">
      <button class="mbtn" onclick="window._closeM()">Cancel</button>
      <button class="mbtn ok" onclick="window._saveCard('${colId}')">Add card</button>
    </div>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) window._closeM(); });
  document.body.appendChild(ov);
  modal = { ov, selP: 0, pendingImg: null };
  setTimeout(() => document.getElementById('nt').focus(), 50);
}

window.mpick = n => {
  if (!modal) return; modal.selP = n;
  document.querySelectorAll('.popt').forEach(b => b.classList.toggle('sel', +b.dataset.v === n));
};
window._closeM = () => { if (modal) { if (modal.unsub) modal.unsub(); modal.ov.remove(); modal = null; } };
window._saveCard = colId => {
  const t = document.getElementById('nt')?.value?.trim();
  if (!t) return;
  const maxOrder = cards.reduce((m, c) => Math.max(m, c.order || 0), 0);
  const data = { text: t, p: modal ? modal.selP : 0, col: colId, order: maxOrder + 1, createdAt: serverTimestamp() };
  if (modal?.pendingImg) data.img = modal.pendingImg;
  addDoc(colRef, data);
  window._closeM();
};

function compressImage(file, maxPx = 900, quality = 0.72) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else       { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.src = URL.createObjectURL(file);
  });
}


let recState = { recorder: null, chunks: [], stream: null, interval: null, seconds: 0 };

function fmtDur(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function openVoice(cardId, cardText) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" style="width:400px">
    <div class="modal-head" style="font-size:13px;color:var(--text-muted);font-weight:400;margin-bottom:4px">Voice notes</div>
    <div style="font-size:14px;font-weight:500;margin-bottom:10px;line-height:1.4">${cardText}</div>
    <div class="rec-list" id="rlist"><div class="rec-hint" style="text-align:center;padding:1rem 0">Loading…</div></div>
    <div class="rec-ctrl">
      <button class="rec-btn idle" id="recbtn" onclick="window._toggleRec('${cardId}')">
        <i class="ti ti-microphone" aria-hidden="true"></i>
      </button>
      <div class="rec-timer" id="rectimer">0:00</div>
      <div class="rec-hint" id="rechint">Tap to record</div>
    </div>
    <div class="modal-foot"><button class="mbtn" onclick="window._closeVoice()">Close</button></div>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) window._closeVoice(); });
  document.body.appendChild(ov);
  modal = { ov, selP: 0 };

  const recRef = collection(db, 'cards', cardId, 'recordings');
  const unsub = onSnapshot(query(recRef, orderBy('createdAt', 'asc')), snap => {
    const list = document.getElementById('rlist');
    if (!list) { unsub(); return; }
    if (snap.empty) { list.innerHTML = '<div class="rec-hint" style="text-align:center;padding:1rem 0;color:var(--text-muted)">No voice notes yet</div>'; return; }
    list.innerHTML = '';
    snap.docs.forEach(d => {
      const r = d.data();
      const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleString() : '';
      const dur = r.duration ? fmtDur(r.duration) : '';
      const item = document.createElement('div'); item.className = 'rec-item';
      item.innerHTML = `
        <div class="rec-item-head">
          <span class="rec-meta">${date}${dur ? ' · ' + dur : ''}</span>
          <button class="iact del" onclick="window._delRec('${cardId}','${d.id}')" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
        <audio class="rec-audio" controls src="${r.audio}"></audio>`;
      list.appendChild(item);
    });
    list.scrollTop = list.scrollHeight;
  });
  modal.unsub = unsub;
}

window._toggleRec = async cardId => {
  if (recState.recorder && recState.recorder.state === 'recording') {
    recState.recorder.stop();
    recState.stream.getTracks().forEach(t => t.stop());
    clearInterval(recState.interval);
    const btn = document.getElementById('recbtn');
    if (btn) { btn.className = 'rec-btn idle'; btn.innerHTML = '<i class="ti ti-microphone" aria-hidden="true"></i>'; }
    const hint = document.getElementById('rechint');
    if (hint) hint.textContent = 'Saving…';
    const timer = document.getElementById('rectimer');
    if (timer) timer.className = 'rec-timer';
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recState.stream = stream; recState.chunks = []; recState.seconds = 0;
      const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m => MediaRecorder.isTypeSupported(m)) || '';
      const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
      recState.recorder = recorder;
      recorder.ondataavailable = e => { if (e.data.size > 0) recState.chunks.push(e.data); };
      recorder.onstop = async () => {
        const duration = recState.seconds;
        const blob = new Blob(recState.chunks, { type: recorder.mimeType || 'audio/webm' });
        const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
        const recRef = collection(db, 'cards', cardId, 'recordings');
        await addDoc(recRef, { audio: b64, duration, createdAt: serverTimestamp() });
        const card = cards.find(c => c._id === cardId);
        updateDoc(doc(db, 'cards', cardId), { voiceCount: (card?.voiceCount || 0) + 1 });
        const hint = document.getElementById('rechint');
        if (hint) hint.textContent = 'Tap to record';
        recState.recorder = null;
      };
      recorder.start();
      const btn = document.getElementById('recbtn');
      if (btn) { btn.className = 'rec-btn recording'; btn.innerHTML = '<i class="ti ti-square" aria-hidden="true"></i>'; }
      const hint = document.getElementById('rechint'); if (hint) hint.textContent = 'Recording… tap to stop';
      const timer = document.getElementById('rectimer'); if (timer) { timer.textContent = '0:00'; timer.className = 'rec-timer active'; }
      recState.interval = setInterval(() => {
        recState.seconds++;
        const t = document.getElementById('rectimer'); if (t) t.textContent = fmtDur(recState.seconds);
      }, 1000);
    } catch { alert('Microphone access denied or unavailable.'); }
  }
};

window._delRec = async (cardId, recId) => {
  await deleteDoc(doc(db, 'cards', cardId, 'recordings', recId));
  const card = cards.find(c => c._id === cardId);
  updateDoc(doc(db, 'cards', cardId), { voiceCount: Math.max(0, (card?.voiceCount || 1) - 1) });
};

window._closeVoice = () => {
  if (recState.recorder && recState.recorder.state === 'recording') {
    recState.recorder.stop();
    recState.stream?.getTracks().forEach(t => t.stop());
    clearInterval(recState.interval);
    recState.recorder = null;
  }
  window._closeM();
};

function openLightbox(url) {
  const lb = document.createElement('div'); lb.className = 'lightbox';
  lb.innerHTML = `<img src="${url}" alt="">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

document.getElementById('yr').textContent = new Date().getFullYear();
